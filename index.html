<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" for="theme-toggle" title="Cambiar tema claro/oscuro">
        <span class="theme-icon">🌙</span>
        <input type="checkbox" id="theme-toggle" />
        <span class="theme-slider"></span>
        <span class="theme-icon">☀️</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <h2 class="start-title">TETRIS</h2>
        <div class="highscores-panel">
          <span class="label">TOP 5</span>
          <div id="start-highscores" class="highscores-list"></div>
        </div>
        <div class="stats-row">
          <div class="stat">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="start-best-combo">0</span>
          </div>
          <div class="stat">
            <span class="label">MÁX. LÍNEAS</span>
            <span class="value" id="start-max-lines">0</span>
          </div>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-scores-btn" class="btn-secondary">Resetear récords</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div class="highscores-panel">
          <span class="label">TOP 5</span>
          <div id="overlay-highscores" class="highscores-list"></div>
        </div>
        <div class="stats-row">
          <div class="stat">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="overlay-best-combo">0</span>
          </div>
          <div class="stat">
            <span class="label">MÁX. LÍNEAS</span>
            <span class="value" id="overlay-max-lines">0</span>
          </div>
        </div>
        <div id="save-score-section" class="save-score-section hidden">
          <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" />
          <button id="save-score-btn">Guardar</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
        <button id="overlay-reset-btn" class="btn-secondary">Resetear récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
